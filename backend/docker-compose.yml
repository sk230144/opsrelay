services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsrelay
      POSTGRES_PASSWORD: opsrelay
      POSTGRES_DB: opsrelay
    ports:
      - "5432:5432"
    volumes:
      - opsrelay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsrelay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  opsrelay_pgdata:
